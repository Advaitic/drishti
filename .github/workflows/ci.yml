name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The runner is headless, so MuJoCo cannot open a GL context and aborts with SIGABRT — a core
      # dump, not a Python exception — the first time a test renders a camera. We give it a real
      # (virtual) X display via xvfb rather than the osmesa software rasteriser: pulling
      # libosmesa6-dev into the same process as torch segfaults it inside torch._dynamo, because
      # both load conflicting LLVM/libstdc++ symbols. On a GPU box, MUJOCO_GL=egl is the fast path.
      MUJOCO_GL: glx
    steps:
      - uses: actions/checkout@v4

      - name: Install a virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1 libglx-mesa0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        # The full extras set. torch lands as the CPU wheel on this runner, which is what we want —
        # nothing in the test suite needs a GPU, network access, or downloaded model weights.
        run: pip install -e '.[all]'

      - name: Test
        run: xvfb-run -a pytest -q

      - name: Calibration reproduces the published report
        # The headline number in the README is only trustworthy if a stranger can regenerate it.
        # This runs the exact command the quickstart gives them, on the bundled rollouts.
        run: |
          drishti calibrate --demo --auto
          python - <<'PY'
          import json, pathlib
          published = json.loads(pathlib.Path("docs/results/calibration/report.json").read_text())
          fresh = json.loads(pathlib.Path("data/demo/calib/report.json").read_text())
          for key in ("auc_fail_vs_success", "fail_caught_frac", "false_alarm_frac", "threshold"):
              assert abs(fresh[key] - published[key]) < 1e-6, (
                  f"{key}: regenerated {fresh[key]} != published {published[key]}")
          print("calibration matches the published report")
          PY
