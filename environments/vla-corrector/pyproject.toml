[project]
name = "vla-corrector"
version = "0.1.2"
description = "verifiers env: RL-train an LLM to correct a black-box action policy (VLA) toward task success in sim"
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.14",   # prime-rl bundles 0.1.15.dev; API verified compatible
    "httpx",
    "datasets",
    "numpy",
]

# Optional: only for the bundled uncertainty detector (uq.py) or the reference rollout server.
# The env itself (vla_corrector.py) needs none of these.
[project.optional-dependencies]
uq = ["torch", "transformers", "pillow", "fastapi", "uvicorn"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["vla_corrector.py", "uq.py", "rollout_server_reference.py"]
