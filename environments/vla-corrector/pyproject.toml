[project]
name = "vla-corrector"
version = "0.1.0"
description = "verifiers env: train a corrective policy over a MolmoAct2 VLA in MuJoCo (drishti rollout server)"
requires-python = ">=3.10"
dependencies = [
    "verifiers==0.1.14",
    "httpx",
    "datasets",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["vla_corrector.py"]
