# Stage 3b — MODEST REAL RUN. GRPO-train the Qwen3-VL corrector against the sim's verifiable reward.
# Budget-capped: watch the pod-hours (MolmoAct2 rollouts dominate cost, not the LLM). Start shaping=false
# (pure success) to confirm signal, then enable shaping if credit assignment is too sparse.
#   uv run rl @ configs/rl/grpo_qwen3vl_4b.toml

[model]
name = "Qwen/Qwen3-VL-4B-Instruct"
optimization_dtype = "bfloat16"        # mandatory for VLMs
reduce_dtype = "bfloat16"

[model.vlm]
vision_encoder_attr = "model.visual"
language_model_attr = "model.language_model"

[model.lora]
rank = 16
alpha = 32
dropout = 0.0

# GRPO. Scale batch_size / rollouts_per_example up only as rollout throughput (parallel pods) allows —
# each rollout is a full MolmoAct2-in-sim episode, so this is the cost/throughput knob (plan R2).
max_steps = 100
batch_size = 32
rollouts_per_example = 8               # GRPO group size

[sampling]
max_tokens = 64
temperature = 1.0

[[env]]
id = "vla-corrector"
args = { rollout_url = "http://ROLLOUT_POD_HOST:8100", n_episodes = 256, max_turns = 4, shaping = true, include_image = true }

[wandb]
project = "drishti-vla-corrector"
name = "grpo-qwen3vl-4b"

# Trainer sizing: a 4B VLM + LoRA fits ~1x A100-80GB for the trainer with gradient checkpointing; inference
# (vLLM) fits a 4090. Finalize [inference]/[trainer]/[orchestrator] on the pod against a prime-rl VLM example.
