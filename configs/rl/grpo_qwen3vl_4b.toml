# GRPO-train the Qwen3-VL-4B corrector against the sim's verifiable reward — the PROVEN combined path.
#   uv run rl @ configs/rl/grpo_qwen3vl_4b.toml     (ONE command; the launcher wires GPU split + coordination)
# REQUIRES A 2-GPU NODE (num_infer_gpus + num_train_gpus = 2 disjoint GPUs). Do NOT hand-split on 1 GPU —
# that loses the trainer<->orchestrator run-registration handshake (see DEBUG_LOG Phase 7).
# Topology (2x A100-80GB): GPU0 = vLLM inference, GPU1 = trainer + the MolmoAct2 rollout server (:8100).
# Each rollout is a FULL MolmoAct2-in-sim episode, so batch_size × max_steps is the cost knob (~1-1.5h at 40).

max_steps = 40
seq_len = 4096

[model]
name = "Qwen/Qwen3-VL-4B-Instruct"     # in prime-rl's MODEL_RENDERER_MAP -> Qwen3VLRenderer (images work)

[model.vlm]
vision_encoder_attr = "model.visual"
language_model_attr = "model.language_model"

[deployment]
num_infer_gpus = 1
num_train_gpus = 1
gpus_per_node = 2

[orchestrator]
batch_size = 8                         # total rollouts per step (cost knob — each is a full sim episode)
group_size = 8                         # GRPO group (rollouts per prompt)
max_off_policy_steps = 16              # async: let the orchestrator pipeline ahead of the trainer

[orchestrator.renderer]
name = "auto"                          # -> Qwen3VLRenderer (keeps the spike frames as image parts)

[[orchestrator.post_batch_filters]]    # don't crash on uniform-reward (zero-advantage) groups early on
type = "zero_advantage"
enforce = false

[orchestrator.train.sampling]
max_completion_tokens = 64

[[orchestrator.train.env]]
id = "vla-corrector"
# dense=true -> staged-progress reward (reward-variance fix). curriculum from the H200 frontier profile
# ([0.275,0.0] was the one 20-80% "flippable" cube position); re-profile finer on the pod for more diversity.
args = { rollout_url = "http://localhost:8100", n_episodes = 64, max_turns = 4, dense = true, shaping = true, include_image = true, curriculum = [[0.275, 0.0]] }

[trainer.model]
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"

[trainer.model.lora]
rank = 16
alpha = 32
dropout = 0.0

[trainer.optim]
lr = 3e-6

[inference.model]
enforce_eager = true                   # vLLM Qwen3-VL deepstack buffer bug workaround

[inference.parallel]
dp = 1
tp = 1

[wandb]
project = "drishti-vla-corrector"
name = "grpo-qwen3vl-4b"
