# Colocated single-GPU (H200) — INFERENCE server (vLLM serving the Qwen3-VL-4B corrector).
# Runs on GPU 0 alongside the trainer + the MolmoAct2 rollout server, so cap VRAM: vLLM gets ~35% of the
# 141GB H200 (~50GB weights+KV), leaving room for the FSDP/LoRA trainer (~30GB) and the VLA server (~11GB).
#   CUDA_VISIBLE_DEVICES=0 uv run inference @ configs/rl/h200_infer.toml
gpu_memory_utilization = 0.35

[model]
name = "Qwen/Qwen3-VL-4B-Instruct"     # in prime-rl's MODEL_RENDERER_MAP -> Qwen3VLRenderer (images work)
enforce_eager = true                   # vLLM Qwen3-VL deepstack buffer bug workaround
