[project]
name = "drishti"
version = "0.1.0"
description = "Runtime failure detection and uncertainty quantification for robot policies"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Advaitic" }]
keywords = ["robotics", "vla", "uncertainty-quantification", "failure-detection",
            "out-of-distribution", "observability", "lerobot", "mujoco"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The telemetry spine and the dashboard. This tier alone runs `drishti demo` — the bundled
# rollouts, the replay view, the uncertainty traces — with no GPU and no model download.
# uvicorn[standard] rather than plain uvicorn: the live-tail WebSocket needs `websockets`, and
# without it the Fleet and Monitor tabs silently never update.
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "numpy>=2.0",
  "pillow>=11",
]

[project.optional-dependencies]
# MuJoCo SO-101 scene, the scripted pick-place, the demo recorder.
sim = ["mujoco>=3.2"]
# The detectors, calibration, the forward hooks, and the figures.
uq = ["torch>=2.4", "safetensors>=0.4", "matplotlib>=3.8"]
# Frozen image encoders (SigLIP / DINOv2) that RND scores on.
embed = ["transformers>=4.44"]
# Loading and running a real VLA (SmolVLA / MolmoAct2) through LeRobot.
policy = ["torch>=2.4", "transformers>=4.44", "safetensors>=0.4",
          "huggingface-hub>=0.25", "lerobot>=0.4"]
# The `vla-corrector` RL environment.
rl = ["verifiers>=0.1.14", "httpx>=0.27", "datasets>=3.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]
# Everything the test suite and the documented no-GPU workflows need.
all = ["drishti[sim,uq,embed,rl,dev]"]

[project.scripts]
drishti = "drishti.cli:main"

[project.urls]
Homepage = "https://github.com/Advaitic/drishti"
Repository = "https://github.com/Advaitic/drishti"
Documentation = "https://github.com/Advaitic/drishti/tree/main/docs"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["drishti*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# So `pytest` works from a clean checkout with no PYTHONPATH juggling. The second entry is the
# standalone RL environment, which deliberately does not import drishti.
pythonpath = [".", "environments/vla-corrector"]
